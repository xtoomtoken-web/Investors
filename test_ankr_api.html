<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Ankr API - XTOO History</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">✅ Test Ankr Advanced API</h1>
        
        <div class="bg-slate-800 rounded-lg p-6 mb-6">
            <h2 class="text-xl font-semibold mb-4">Ankr Advanced API - ankr_getTokenTransfers</h2>
            
            <div class="mb-4">
                <label class="block text-sm text-gray-400 mb-2">Wallet Address</label>
                <input type="text" id="walletInput" 
                       value="0xb9707c6e18417fa88c0f99c39e02b93cd3b6a156"
                       class="w-full bg-slate-700 text-white px-3 py-2 rounded border border-slate-600">
            </div>
            
            <div class="mb-4">
                <label class="block text-sm text-gray-400 mb-2">Ankr API Token (✅ Configured)</label>
                <input type="password" id="tokenInput" 
                       value="b8ca6addb739c1a0b0ff1459c35e3807ed41fba669db7e4cfc13abdc45d9c6f5"
                       class="w-full bg-slate-700 text-white px-3 py-2 rounded border border-slate-600">
            </div>
            
            <button onclick="testAnkrAPI()" class="bg-green-600 hover:bg-green-700 px-6 py-3 rounded font-semibold">
                🚀 Test Ankr API
            </button>
        </div>

        <div id="results" class="space-y-4"></div>
    </div>

    <script>
        async function testAnkrAPI() {
            const wallet = document.getElementById('walletInput').value;
            const token = document.getElementById('tokenInput').value;
            const resultsDiv = document.getElementById('results');
            
            resultsDiv.innerHTML = `
                <div class="bg-slate-800 rounded-lg p-6">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-green-400 mx-auto mb-4"></div>
                    <p class="text-center text-gray-400">Testing Ankr Advanced API...</p>
                    <p class="text-center text-xs text-gray-500 mt-2">This may take a few seconds</p>
                </div>
            `;
            
            const endpoint = `https://rpc.ankr.com/multichain/${token}`;
            
            const request = {
                jsonrpc: '2.0',
                method: 'ankr_getTokenTransfers',
                params: {
                    address: [wallet],
                    blockchain: ['bsc'],
                    fromTimestamp: 0,
                    toTimestamp: Math.floor(Date.now() / 1000)
                },
                id: 1
            };
            
            console.log('🔗 Ankr Endpoint:', endpoint.substring(0, 50) + '...');
            console.log('📋 Request:', request);
            
            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(request)
                });
                
                const data = await response.json();
                
                console.log('📊 Response:', data);
                
                if (data.result && data.result.transfers) {
                    // Filter for XTOO only
                    const xtooTransfers = data.result.transfers.filter(tx => 
                        tx.contractAddress && tx.contractAddress.toLowerCase() === '0x5cfc37a4ae6108e146f2bbed702c4acabb5a149a'
                    );
                    
                    displaySuccess(xtooTransfers, wallet);
                } else if (data.error) {
                    displayError(data.error);
                } else {
                    displayNoResults();
                }
                
            } catch (error) {
                console.error('❌ Error:', error);
                resultsDiv.innerHTML = `
                    <div class="bg-red-900/30 border border-red-500 rounded-lg p-6">
                        <h3 class="text-xl font-bold text-red-400">❌ Fetch Error</h3>
                        <p class="text-gray-300">${error.message}</p>
                    </div>
                `;
            }
        }
        
        function displaySuccess(transfers, wallet) {
            const resultsDiv = document.getElementById('results');
            
            const totalXTOO = transfers.reduce((sum, tx) => {
                const decimals = parseInt(tx.tokenDecimals || 18);
                const amount = parseFloat(tx.value) / Math.pow(10, decimals);
                return sum + amount;
            }, 0);
            
            console.log(`✅ Found ${transfers.length} XTOO transfers`);
            console.log(`💰 Total XTOO: ${totalXTOO.toFixed(6)} XTOO`);
            
            resultsDiv.innerHTML = `
                <div class="bg-green-900/30 border border-green-500 rounded-lg p-6">
                    <h3 class="text-2xl font-bold text-green-400 mb-4">✅ Ankr API Works Perfectly!</h3>
                    
                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <div class="bg-slate-800 rounded-lg p-4">
                            <p class="text-sm text-gray-400">XTOO Transfers Found</p>
                            <p class="text-3xl font-bold text-white">${transfers.length}</p>
                        </div>
                        <div class="bg-slate-800 rounded-lg p-4">
                            <p class="text-sm text-gray-400">Total XTOO Received</p>
                            <p class="text-3xl font-bold text-green-400">${totalXTOO.toFixed(2)}</p>
                        </div>
                    </div>
                    
                    <h4 class="font-bold mb-3">Recent XTOO Transactions:</h4>
                    <div class="space-y-2 max-h-96 overflow-y-auto">
                        ${transfers.slice(0, 20).map((tx, i) => {
                            const decimals = parseInt(tx.tokenDecimals || 18);
                            const amount = parseFloat(tx.value) / Math.pow(10, decimals);
                            const date = tx.timestamp ? new Date(tx.timestamp * 1000).toLocaleDateString() : 'Unknown';
                            const direction = tx.toAddress.toLowerCase() === wallet.toLowerCase() ? 'IN' : 'OUT';
                            const directionColor = direction === 'IN' ? 'text-green-400' : 'text-red-400';
                            
                            return `
                                <div class="bg-slate-800 rounded p-3">
                                    <div class="flex justify-between items-start">
                                        <div class="flex-1">
                                            <p class="text-xs text-gray-400">#${i + 1} - ${date}</p>
                                            <p class="text-sm font-mono text-gray-300 mt-1">
                                                <a href="https://bscscan.com/tx/${tx.transactionHash}" target="_blank" class="hover:text-blue-400">
                                                    ${tx.transactionHash.slice(0, 20)}... ↗
                                                </a>
                                            </p>
                                            <p class="text-xs text-gray-400 mt-1">
                                                ${direction === 'IN' ? 'From' : 'To'}: ${(direction === 'IN' ? tx.fromAddress : tx.toAddress).slice(0, 10)}...
                                            </p>
                                        </div>
                                        <div class="text-right">
                                            <p class="text-lg font-bold ${directionColor}">${direction === 'IN' ? '+' : '-'}${amount.toFixed(2)}</p>
                                            <p class="text-xs text-gray-400">XTOO</p>
                                        </div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                    
                    <div class="mt-4 bg-blue-900/30 border border-blue-500/50 rounded p-3">
                        <p class="text-sm text-blue-300 font-bold">✅ ANKR API WORKING!</p>
                        <p class="text-xs text-gray-400 mt-1">Ready to integrate into dashboard</p>
                    </div>
                </div>
            `;
        }
        
        function displayError(error) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = `
                <div class="bg-red-900/30 border border-red-500 rounded-lg p-6">
                    <h3 class="text-xl font-bold text-red-400 mb-2">❌ API Error</h3>
                    <div class="bg-slate-900 rounded p-4">
                        <p class="text-sm text-gray-400 mb-2">Error Details:</p>
                        <pre class="text-xs text-gray-300 overflow-x-auto">${JSON.stringify(error, null, 2)}</pre>
                    </div>
                </div>
            `;
        }
        
        function displayNoResults() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = `
                <div class="bg-yellow-900/30 border border-yellow-500 rounded-lg p-6">
                    <h3 class="text-xl font-bold text-yellow-400 mb-2">⚠️ No Results</h3>
                    <p class="text-gray-300">No XTOO transactions found for this wallet.</p>
                </div>
            `;
        }
    </script>
</body>
</html>
