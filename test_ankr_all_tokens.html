<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Ankr API - All Tokens</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white p-8">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">🔍 Ankr API - All Token Transfers</h1>
        
        <div class="bg-slate-800 rounded-lg p-6 mb-6">
            <h2 class="text-xl font-semibold mb-4">Ver TODOS los tokens del wallet</h2>
            
            <div class="mb-4">
                <label class="block text-sm text-gray-400 mb-2">Tu Wallet Address</label>
                <input type="text" id="walletInput" 
                       value="0xb9707c6e18417fa88c0f99c39e02b93cd3b6a156"
                       placeholder="Pega tu wallet address aquí"
                       class="w-full bg-slate-700 text-white px-3 py-2 rounded border border-slate-600">
            </div>
            
            <button onclick="testAllTokens()" class="bg-blue-600 hover:bg-blue-700 px-6 py-3 rounded font-semibold">
                🔍 Ver Todos los Tokens
            </button>
        </div>

        <div id="results" class="space-y-4"></div>
    </div>

    <script>
        const ANKR_TOKEN = 'b8ca6addb739c1a0b0ff1459c35e3807ed41fba669db7e4cfc13abdc45d9c6f5';
        const ANKR_ENDPOINT = `https://rpc.ankr.com/multichain/${ANKR_TOKEN}`;
        
        async function testAllTokens() {
            const wallet = document.getElementById('walletInput').value.trim();
            const resultsDiv = document.getElementById('results');
            
            if (!wallet || !wallet.startsWith('0x')) {
                resultsDiv.innerHTML = `
                    <div class="bg-red-900/30 border border-red-500 rounded-lg p-6">
                        <p class="text-red-400">⚠️ Por favor ingresa un wallet address válido</p>
                    </div>
                `;
                return;
            }
            
            resultsDiv.innerHTML = `
                <div class="bg-slate-800 rounded-lg p-6">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-400 mx-auto mb-4"></div>
                    <p class="text-center text-gray-400">Buscando TODAS las transacciones de tokens...</p>
                    <p class="text-center text-xs text-gray-500 mt-2">Esto puede tardar unos segundos</p>
                </div>
            `;
            
            const request = {
                jsonrpc: '2.0',
                method: 'ankr_getTokenTransfers',
                params: {
                    address: [wallet],
                    blockchain: ['bsc']
                    // Sin filtro de timestamp = obtiene todo
                },
                id: 1
            };
            
            console.log('🔗 Request:', request);
            
            try {
                const response = await fetch(ANKR_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(request)
                });
                
                const data = await response.json();
                console.log('📊 Response:', data);
                
                if (data.result && data.result.transfers) {
                    displayAllTokens(data.result.transfers, wallet);
                } else if (data.error) {
                    displayError(data.error);
                } else {
                    displayNoResults();
                }
                
            } catch (error) {
                console.error('❌ Error:', error);
                resultsDiv.innerHTML = `
                    <div class="bg-red-900/30 border border-red-500 rounded-lg p-6">
                        <h3 class="text-xl font-bold text-red-400">❌ Error</h3>
                        <p class="text-gray-300">${error.message}</p>
                    </div>
                `;
            }
        }
        
        function displayAllTokens(transfers, wallet) {
            const resultsDiv = document.getElementById('results');
            
            // Group by token
            const tokenGroups = {};
            transfers.forEach(tx => {
                const symbol = tx.tokenSymbol || 'UNKNOWN';
                if (!tokenGroups[symbol]) {
                    tokenGroups[symbol] = {
                        symbol: symbol,
                        name: tx.tokenName || 'Unknown',
                        contract: tx.contractAddress,
                        transfers: [],
                        totalIn: 0,
                        totalOut: 0
                    };
                }
                
                const decimals = parseInt(tx.tokenDecimals || 18);
                const amount = parseFloat(tx.value) / Math.pow(10, decimals);
                const isIncoming = tx.toAddress.toLowerCase() === wallet.toLowerCase();
                
                tokenGroups[symbol].transfers.push(tx);
                if (isIncoming) {
                    tokenGroups[symbol].totalIn += amount;
                } else {
                    tokenGroups[symbol].totalOut += amount;
                }
            });
            
            const tokenList = Object.values(tokenGroups);
            
            // Check for XTOO specifically
            const xtooToken = tokenList.find(t => 
                t.symbol.toLowerCase() === 'xtoo' || 
                t.contract.toLowerCase() === '0x5cfc37a4ae6108e146f2bbed702c4acabb5a149a'
            );
            
            console.log('📊 Found tokens:', tokenList.map(t => t.symbol));
            console.log('🔍 XTOO found?', xtooToken ? 'YES' : 'NO');
            
            resultsDiv.innerHTML = `
                <div class="bg-slate-800 rounded-lg p-6">
                    <h3 class="text-2xl font-bold mb-4">📊 Tokens Encontrados: ${tokenList.length}</h3>
                    <p class="text-gray-400 mb-4">Total transfers: ${transfers.length}</p>
                    
                    ${xtooToken ? `
                        <div class="bg-green-900/30 border border-green-500 rounded-lg p-4 mb-4">
                            <h4 class="text-xl font-bold text-green-400 mb-2">✅ XTOO Encontrado!</h4>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <p class="text-sm text-gray-400">Transacciones</p>
                                    <p class="text-2xl font-bold text-white">${xtooToken.transfers.length}</p>
                                </div>
                                <div>
                                    <p class="text-sm text-gray-400">Total Recibido</p>
                                    <p class="text-2xl font-bold text-green-400">${xtooToken.totalIn.toFixed(2)} XTOO</p>
                                </div>
                            </div>
                        </div>
                    ` : `
                        <div class="bg-yellow-900/30 border border-yellow-500 rounded-lg p-4 mb-4">
                            <p class="text-yellow-400">⚠️ No se encontró XTOO en este wallet</p>
                            <p class="text-xs text-gray-400 mt-2">Contract esperado: 0x5cFC37a4AE6108E146f2Bbed702c4AcaBB5a149a</p>
                        </div>
                    `}
                    
                    <h4 class="font-bold mb-3">Todos los Tokens (Top 20):</h4>
                    <div class="space-y-2 max-h-[600px] overflow-y-auto">
                        ${tokenList.slice(0, 20).map((token, i) => `
                            <div class="bg-slate-700 rounded p-4">
                                <div class="flex justify-between items-start mb-2">
                                    <div>
                                        <p class="text-lg font-bold text-white">${token.symbol}</p>
                                        <p class="text-sm text-gray-400">${token.name}</p>
                                        <p class="text-xs text-gray-500 font-mono">${token.contract}</p>
                                    </div>
                                    <div class="text-right">
                                        <p class="text-sm text-green-400">IN: ${token.totalIn.toFixed(2)}</p>
                                        <p class="text-sm text-red-400">OUT: ${token.totalOut.toFixed(2)}</p>
                                        <p class="text-xs text-gray-400">${token.transfers.length} txs</p>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }
        
        function displayError(error) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = `
                <div class="bg-red-900/30 border border-red-500 rounded-lg p-6">
                    <h3 class="text-xl font-bold text-red-400 mb-2">❌ API Error</h3>
                    <pre class="text-xs text-gray-300 overflow-x-auto">${JSON.stringify(error, null, 2)}</pre>
                </div>
            `;
        }
        
        function displayNoResults() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = `
                <div class="bg-yellow-900/30 border border-yellow-500 rounded-lg p-6">
                    <h3 class="text-xl font-bold text-yellow-400 mb-2">⚠️ Sin Resultados</h3>
                    <p class="text-gray-300">No se encontraron transacciones de tokens para este wallet.</p>
                    <p class="text-sm text-gray-400 mt-2">Verifica que el wallet address sea correcto.</p>
                </div>
            `;
        }
    </script>
</body>
</html>
