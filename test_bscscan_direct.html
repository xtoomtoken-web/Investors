<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test BSCScan API Direct</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">🧪 Test BSCScan API (Standard Endpoint)</h1>
        
        <div class="bg-slate-800 rounded-lg p-6 mb-6">
            <h2 class="text-xl font-semibold mb-4">Endpoint: api.bscscan.com/api</h2>
            
            <div class="mb-4">
                <label class="block text-sm text-gray-400 mb-2">Wallet Address</label>
                <input type="text" id="walletInput" 
                       value="0xb9707c6e18417fa88c0f99c39e02b93cd3b6a156"
                       class="w-full bg-slate-700 text-white px-3 py-2 rounded border border-slate-600">
            </div>
            
            <div class="mb-4">
                <label class="block text-sm text-gray-400 mb-2">BSCScan API Key (✅ Configured)</label>
                <input type="password" id="apiKeyInput" 
                       value="1SBKZNRWAU5MS3Q2VQXFMUZWMGKJRSGF5M"
                       placeholder="Paste your BSCScan API key here"
                       class="w-full bg-slate-700 text-white px-3 py-2 rounded border border-slate-600">
            </div>
            
            <button onclick="testBSCScanAPI()" class="bg-blue-600 hover:bg-blue-700 px-6 py-3 rounded font-semibold">
                Test BSCScan API
            </button>
        </div>

        <div id="results" class="space-y-4"></div>
    </div>

    <script>
        async function testBSCScanAPI() {
            const wallet = document.getElementById('walletInput').value;
            const apiKey = document.getElementById('apiKeyInput').value;
            const resultsDiv = document.getElementById('results');
            
            if (!apiKey) {
                resultsDiv.innerHTML = `
                    <div class="bg-yellow-900/30 border border-yellow-500 rounded-lg p-6">
                        <h3 class="text-xl font-bold text-yellow-400">⚠️ API Key Required</h3>
                        <p class="text-gray-300 mt-2">Please enter your BSCScan API key</p>
                    </div>
                `;
                return;
            }
            
            resultsDiv.innerHTML = `
                <div class="bg-slate-800 rounded-lg p-6">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-400 mx-auto mb-4"></div>
                    <p class="text-center text-gray-400">Testing BSCScan API...</p>
                </div>
            `;
            
            // Standard BSCScan API endpoint (NO chainid parameter)
            const url = `https://api.bscscan.com/api?module=account&action=tokentx&contractaddress=0x5cFC37a4AE6108E146f2Bbed702c4AcaBB5a149a&address=${wallet}&page=1&offset=100&sort=desc&apikey=${apiKey}`;
            
            console.log('🔗 Testing URL:', url.replace(apiKey, 'API_KEY_HIDDEN'));
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                console.log('📊 Response:', data);
                
                if (data.status === '1' && data.result && Array.isArray(data.result)) {
                    displaySuccess(data.result, wallet);
                } else {
                    displayError(data);
                }
                
            } catch (error) {
                console.error('❌ Error:', error);
                resultsDiv.innerHTML = `
                    <div class="bg-red-900/30 border border-red-500 rounded-lg p-6">
                        <h3 class="text-xl font-bold text-red-400">❌ Fetch Error</h3>
                        <p class="text-gray-300">${error.message}</p>
                    </div>
                `;
            }
        }
        
        function displaySuccess(transactions, wallet) {
            const resultsDiv = document.getElementById('results');
            
            const totalXTOO = transactions.reduce((sum, tx) => {
                const amount = parseFloat(tx.value) / Math.pow(10, parseInt(tx.tokenDecimal));
                return sum + amount;
            }, 0);
            
            console.log(`✅ Found ${transactions.length} XTOO transactions`);
            console.log(`💰 Total XTOO: ${totalXTOO.toFixed(6)} XTOO`);
            
            resultsDiv.innerHTML = `
                <div class="bg-green-900/30 border border-green-500 rounded-lg p-6">
                    <h3 class="text-2xl font-bold text-green-400 mb-4">✅ BSCScan API Works!</h3>
                    
                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <div class="bg-slate-800 rounded-lg p-4">
                            <p class="text-sm text-gray-400">Transactions Found</p>
                            <p class="text-3xl font-bold text-white">${transactions.length}</p>
                        </div>
                        <div class="bg-slate-800 rounded-lg p-4">
                            <p class="text-sm text-gray-400">Total XTOO</p>
                            <p class="text-3xl font-bold text-green-400">${totalXTOO.toFixed(2)}</p>
                        </div>
                    </div>
                    
                    <h4 class="font-bold mb-3">Recent Transactions:</h4>
                    <div class="space-y-2 max-h-96 overflow-y-auto">
                        ${transactions.slice(0, 10).map((tx, i) => {
                            const amount = parseFloat(tx.value) / Math.pow(10, parseInt(tx.tokenDecimal));
                            const date = new Date(parseInt(tx.timeStamp) * 1000).toLocaleDateString();
                            return `
                                <div class="bg-slate-800 rounded p-3">
                                    <div class="flex justify-between items-start">
                                        <div class="flex-1">
                                            <p class="text-xs text-gray-400">#${i + 1} - ${date}</p>
                                            <p class="text-sm font-mono text-gray-300 mt-1">
                                                <a href="https://bscscan.com/tx/${tx.hash}" target="_blank" class="hover:text-blue-400">
                                                    ${tx.hash.slice(0, 20)}... ↗
                                                </a>
                                            </p>
                                        </div>
                                        <div class="text-right">
                                            <p class="text-lg font-bold text-green-400">${amount.toFixed(2)}</p>
                                            <p class="text-xs text-gray-400">XTOO</p>
                                        </div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                    
                    <div class="mt-4 bg-blue-900/30 border border-blue-500/50 rounded p-3">
                        <p class="text-sm text-blue-300">✅ This API key works! Ready to integrate into dashboard.</p>
                    </div>
                </div>
            `;
        }
        
        function displayError(data) {
            const resultsDiv = document.getElementById('results');
            
            resultsDiv.innerHTML = `
                <div class="bg-red-900/30 border border-red-500 rounded-lg p-6">
                    <h3 class="text-xl font-bold text-red-400 mb-2">❌ API Error</h3>
                    <div class="bg-slate-900 rounded p-4">
                        <div class="grid grid-cols-2 gap-4 mb-4">
                            <div>
                                <p class="text-sm text-gray-400">Status</p>
                                <p class="text-white font-bold">${data.status}</p>
                            </div>
                            <div>
                                <p class="text-sm text-gray-400">Message</p>
                                <p class="text-white font-bold">${data.message || 'N/A'}</p>
                            </div>
                        </div>
                        <p class="text-sm text-gray-400 mb-2">Full Response:</p>
                        <pre class="text-xs text-gray-300 overflow-x-auto">${JSON.stringify(data, null, 2)}</pre>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
