<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Ankr FINAL - Corrected Parsing</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">✅ Test Ankr FINAL - Parsing Corregido</h1>
        
        <div class="bg-slate-800 rounded-lg p-6 mb-6">
            <h2 class="text-xl font-semibold mb-4">Test con parsing correcto</h2>
            
            <div class="mb-4">
                <label class="block text-sm text-gray-400 mb-2">Tu Wallet Address</label>
                <input type="text" id="walletInput" 
                       value="0xb9707c6e18417fa88c0f99c39e02b93cd3b6a156"
                       class="w-full bg-slate-700 text-white px-3 py-2 rounded border border-slate-600">
            </div>
            
            <button onclick="testFinal()" class="bg-green-600 hover:bg-green-700 px-6 py-3 rounded font-semibold">
                🚀 Test Final
            </button>
        </div>

        <div id="results" class="space-y-4"></div>
    </div>

    <script>
        const ANKR_TOKEN = 'b8ca6addb739c1a0b0ff1459c35e3807ed41fba669db7e4cfc13abdc45d9c6f5';
        const ANKR_ENDPOINT = `https://rpc.ankr.com/multichain/${ANKR_TOKEN}`;
        
        async function testFinal() {
            const wallet = document.getElementById('walletInput').value.trim();
            const resultsDiv = document.getElementById('results');
            
            resultsDiv.innerHTML = `
                <div class="bg-slate-800 rounded-lg p-6">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-green-400 mx-auto mb-4"></div>
                    <p class="text-center text-gray-400">Calculando totales XTOO...</p>
                </div>
            `;
            
            const request = {
                jsonrpc: '2.0',
                method: 'ankr_getTokenTransfers',
                params: {
                    address: [wallet],
                    blockchain: ['bsc']
                },
                id: 1
            };
            
            try {
                const response = await fetch(ANKR_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(request)
                });
                
                const data = await response.json();
                
                if (data.result && data.result.transfers) {
                    // Filter XTOO only
                    const allXTOO = data.result.transfers.filter(tx => 
                        tx.contractAddress && tx.contractAddress.toLowerCase() === '0x5cfc37a4ae6108e146f2bbed702c4acabb5a149a'
                    );
                    
                    // Separate IN and OUT
                    const inTransfers = allXTOO.filter(tx => 
                        tx.toAddress && tx.toAddress.toLowerCase() === wallet.toLowerCase()
                    );
                    
                    const outTransfers = allXTOO.filter(tx => 
                        tx.fromAddress && tx.fromAddress.toLowerCase() === wallet.toLowerCase()
                    );
                    
                    // Calculate totals - Ankr values are ALREADY in decimal format
                    const totalIn = inTransfers.reduce((sum, tx) => {
                        const amount = parseFloat(tx.value) || 0;
                        return sum + amount;
                    }, 0);
                    
                    const totalOut = outTransfers.reduce((sum, tx) => {
                        const amount = parseFloat(tx.value) || 0;
                        return sum + amount;
                    }, 0);
                    
                    const netBalance = totalIn - totalOut;
                    
                    displayResults({
                        totalTransfers: allXTOO.length,
                        inCount: inTransfers.length,
                        outCount: outTransfers.length,
                        totalIn: totalIn,
                        totalOut: totalOut,
                        netBalance: netBalance,
                        inTransfers: inTransfers.slice(0, 10),
                        outTransfers: outTransfers.slice(0, 10)
                    });
                } else {
                    resultsDiv.innerHTML = `<div class="bg-red-900/30 border border-red-500 rounded-lg p-6"><p class="text-red-400">Error: ${JSON.stringify(data)}</p></div>`;
                }
                
            } catch (error) {
                resultsDiv.innerHTML = `<div class="bg-red-900/30 border border-red-500 rounded-lg p-6"><p class="text-red-400">Error: ${error.message}</p></div>`;
            }
        }
        
        function displayResults(data) {
            const resultsDiv = document.getElementById('results');
            
            console.log('📊 Results:', data);
            
            resultsDiv.innerHTML = `
                <div class="bg-green-900/30 border border-green-500 rounded-lg p-6">
                    <h3 class="text-3xl font-bold text-green-400 mb-6">✅ ¡Funciona Perfectamente!</h3>
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                        <div class="bg-slate-800 rounded-lg p-4">
                            <p class="text-sm text-gray-400">Total Transacciones</p>
                            <p class="text-3xl font-bold text-white">${data.totalTransfers}</p>
                            <p class="text-xs text-gray-400 mt-1">${data.inCount} IN, ${data.outCount} OUT</p>
                        </div>
                        <div class="bg-green-900/30 border border-green-500 rounded-lg p-4">
                            <p class="text-sm text-gray-400">Total XTOO Recibido (IN)</p>
                            <p class="text-3xl font-bold text-green-400">${data.totalIn.toFixed(2)}</p>
                            <p class="text-xs text-gray-400 mt-1">Para cálculo de ROI</p>
                        </div>
                        <div class="bg-red-900/30 border border-red-500 rounded-lg p-4">
                            <p class="text-sm text-gray-400">Total XTOO Enviado (OUT)</p>
                            <p class="text-3xl font-bold text-red-400">${data.totalOut.toFixed(2)}</p>
                        </div>
                    </div>
                    
                    <div class="bg-blue-900/30 border border-blue-500 rounded-lg p-4 mb-6">
                        <p class="text-sm text-gray-400">Balance Neto</p>
                        <p class="text-2xl font-bold text-white">${data.netBalance.toFixed(2)} XTOO</p>
                        <p class="text-xs text-gray-400 mt-1">IN - OUT = Net Balance</p>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <h4 class="font-bold mb-3 text-green-400">📥 Últimas 10 Transacciones IN:</h4>
                            <div class="space-y-2 max-h-96 overflow-y-auto">
                                ${data.inTransfers.map((tx, i) => {
                                    const amount = parseFloat(tx.value);
                                    const date = tx.timestamp ? new Date(tx.timestamp * 1000).toLocaleDateString() : 'N/A';
                                    return `
                                        <div class="bg-slate-800 rounded p-3">
                                            <div class="flex justify-between">
                                                <div>
                                                    <p class="text-xs text-gray-400">${date}</p>
                                                    <p class="text-xs font-mono text-gray-500">${tx.transactionHash.slice(0, 15)}...</p>
                                                </div>
                                                <p class="text-lg font-bold text-green-400">+${amount.toFixed(2)}</p>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                        
                        <div>
                            <h4 class="font-bold mb-3 text-red-400">📤 Últimas 10 Transacciones OUT:</h4>
                            <div class="space-y-2 max-h-96 overflow-y-auto">
                                ${data.outTransfers.map((tx, i) => {
                                    const amount = parseFloat(tx.value);
                                    const date = tx.timestamp ? new Date(tx.timestamp * 1000).toLocaleDateString() : 'N/A';
                                    return `
                                        <div class="bg-slate-800 rounded p-3">
                                            <div class="flex justify-between">
                                                <div>
                                                    <p class="text-xs text-gray-400">${date}</p>
                                                    <p class="text-xs font-mono text-gray-500">${tx.transactionHash.slice(0, 15)}...</p>
                                                </div>
                                                <p class="text-lg font-bold text-red-400">-${amount.toFixed(2)}</p>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    </div>
                    
                    <div class="mt-6 bg-purple-900/30 border border-purple-500 rounded-lg p-4">
                        <h4 class="font-bold mb-2 text-purple-400">✅ Listo para Dashboard</h4>
                        <ul class="text-sm text-gray-300 space-y-1">
                            <li>✓ Parsing correcto (sin dividir por decimals)</li>
                            <li>✓ Separación IN/OUT funcionando</li>
                            <li>✓ Total XTOO Received: ${data.totalIn.toFixed(2)} XTOO</li>
                            <li>✓ Este valor se usará para calcular ROI</li>
                        </ul>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
