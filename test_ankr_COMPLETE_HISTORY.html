<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Ankr - Complete History</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">🔍 Ankr - Complete History (con Pagination)</h1>
        
        <div class="bg-slate-800 rounded-lg p-6 mb-6">
            <h2 class="text-xl font-semibold mb-4">Obtener TODAS las transacciones XTOO</h2>
            
            <div class="mb-4">
                <label class="block text-sm text-gray-400 mb-2">Tu Wallet Address</label>
                <input type="text" id="walletInput" 
                       value="0xb9707c6e18417fa88c0f99c39e02b93cd3b6a156"
                       class="w-full bg-slate-700 text-white px-3 py-2 rounded border border-slate-600">
            </div>
            
            <div class="mb-4">
                <label class="block text-sm text-gray-400 mb-2">Balance Actual en Wallet (para comparar)</label>
                <input type="number" id="currentBalanceInput" 
                       value="0"
                       placeholder="Ej: 1234.56"
                       class="w-full bg-slate-700 text-white px-3 py-2 rounded border border-slate-600">
            </div>
            
            <button onclick="getAllHistory()" class="bg-blue-600 hover:bg-blue-700 px-6 py-3 rounded font-semibold">
                🔍 Obtener Historia Completa
            </button>
        </div>

        <div id="results" class="space-y-4"></div>
    </div>

    <script>
        const ANKR_TOKEN = 'b8ca6addb739c1a0b0ff1459c35e3807ed41fba669db7e4cfc13abdc45d9c6f5';
        const ANKR_ENDPOINT = `https://rpc.ankr.com/multichain/${ANKR_TOKEN}`;
        
        async function getAllHistory() {
            const wallet = document.getElementById('walletInput').value.trim();
            const currentBalance = parseFloat(document.getElementById('currentBalanceInput').value) || 0;
            const resultsDiv = document.getElementById('results');
            
            resultsDiv.innerHTML = `
                <div class="bg-slate-800 rounded-lg p-6">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-400 mx-auto mb-4"></div>
                    <p class="text-center text-gray-400">Obteniendo historia completa...</p>
                    <p class="text-center text-xs text-gray-500 mt-2">Esto puede tardar un poco</p>
                </div>
            `;
            
            try {
                // Request with pagination support
                const request = {
                    jsonrpc: '2.0',
                    method: 'ankr_getTokenTransfers',
                    params: {
                        address: [wallet],
                        blockchain: ['bsc'],
                        pageSize: 500, // Maximum
                        // No timestamp filters = desde el inicio
                    },
                    id: 1
                };
                
                console.log('📋 Request:', request);
                
                const response = await fetch(ANKR_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(request)
                });
                
                const data = await response.json();
                console.log('📊 Response:', data);
                
                if (data.result && data.result.transfers) {
                    analyzeHistory(data.result, wallet, currentBalance);
                } else {
                    resultsDiv.innerHTML = `
                        <div class="bg-red-900/30 border border-red-500 rounded-lg p-6">
                            <p class="text-red-400">Error: ${JSON.stringify(data)}</p>
                        </div>
                    `;
                }
                
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="bg-red-900/30 border border-red-500 rounded-lg p-6">
                        <p class="text-red-400">Error: ${error.message}</p>
                    </div>
                `;
            }
        }
        
        function analyzeHistory(result, wallet, expectedBalance) {
            const resultsDiv = document.getElementById('results');
            
            // Filter XTOO
            const allXTOO = result.transfers.filter(tx => 
                tx.contractAddress && tx.contractAddress.toLowerCase() === '0x5cfc37a4ae6108e146f2bbed702c4acabb5a149a'
            );
            
            // Separate IN and OUT
            const inTransfers = allXTOO.filter(tx => 
                tx.toAddress && tx.toAddress.toLowerCase() === wallet.toLowerCase()
            );
            
            const outTransfers = allXTOO.filter(tx => 
                tx.fromAddress && tx.fromAddress.toLowerCase() === wallet.toLowerCase()
            );
            
            // Calculate totals
            const totalIn = inTransfers.reduce((sum, tx) => sum + (parseFloat(tx.value) || 0), 0);
            const totalOut = outTransfers.reduce((sum, tx) => sum + (parseFloat(tx.value) || 0), 0);
            const calculatedBalance = totalIn - totalOut;
            
            // Analyze discrepancy
            const discrepancy = Math.abs(calculatedBalance - expectedBalance);
            const discrepancyPercent = expectedBalance > 0 ? (discrepancy / expectedBalance) * 100 : 0;
            
            console.log('📊 Analysis:', {
                totalTransfers: allXTOO.length,
                inCount: inTransfers.length,
                outCount: outTransfers.length,
                totalIn,
                totalOut,
                calculatedBalance,
                expectedBalance,
                discrepancy,
                hasNextPage: result.nextPageToken ? true : false
            });
            
            resultsDiv.innerHTML = `
                <div class="bg-slate-800 rounded-lg p-6">
                    <h3 class="text-2xl font-bold mb-6">📊 Análisis Completo</h3>
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                        <div class="bg-slate-700 rounded-lg p-4">
                            <p class="text-sm text-gray-400">Total Transacciones XTOO</p>
                            <p class="text-3xl font-bold text-white">${allXTOO.length}</p>
                            <p class="text-xs text-gray-400 mt-1">${inTransfers.length} IN, ${outTransfers.length} OUT</p>
                        </div>
                        <div class="bg-green-900/30 border border-green-500 rounded-lg p-4">
                            <p class="text-sm text-gray-400">Total XTOO IN</p>
                            <p class="text-2xl font-bold text-green-400">${totalIn.toFixed(2)}</p>
                        </div>
                        <div class="bg-red-900/30 border border-red-500 rounded-lg p-4">
                            <p class="text-sm text-gray-400">Total XTOO OUT</p>
                            <p class="text-2xl font-bold text-red-400">${totalOut.toFixed(2)}</p>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                        <div class="bg-blue-900/30 border border-blue-500 rounded-lg p-4">
                            <p class="text-sm text-gray-400">Balance Calculado (IN - OUT)</p>
                            <p class="text-3xl font-bold text-white">${calculatedBalance.toFixed(2)}</p>
                        </div>
                        <div class="bg-purple-900/30 border border-purple-500 rounded-lg p-4">
                            <p class="text-sm text-gray-400">Balance Actual en Wallet</p>
                            <p class="text-3xl font-bold text-white">${expectedBalance.toFixed(2)}</p>
                        </div>
                    </div>
                    
                    ${discrepancy > 0.01 ? `
                        <div class="bg-yellow-900/30 border border-yellow-500 rounded-lg p-4 mb-6">
                            <h4 class="font-bold text-yellow-400 mb-2">⚠️ Discrepancia Detectada</h4>
                            <p class="text-white">Diferencia: ${discrepancy.toFixed(2)} XTOO (${discrepancyPercent.toFixed(1)}%)</p>
                            <p class="text-sm text-gray-400 mt-2">Posibles causas:</p>
                            <ul class="text-sm text-gray-300 list-disc ml-6 mt-2">
                                <li>Ankr no devuelve transacciones muy antiguas</li>
                                <li>Hay más transacciones (necesita paginación)</li>
                                <li>Tokens recibidos via smart contract/swap</li>
                                <li>Airdrops o rewards no capturados</li>
                            </ul>
                            ${result.nextPageToken ? `
                                <p class="text-yellow-400 font-bold mt-3">📄 Hay más páginas disponibles!</p>
                            ` : ''}
                        </div>
                    ` : `
                        <div class="bg-green-900/30 border border-green-500 rounded-lg p-4 mb-6">
                            <h4 class="font-bold text-green-400 mb-2">✅ Balance Correcto</h4>
                            <p class="text-white">El balance calculado coincide con el balance actual</p>
                        </div>
                    `}
                    
                    <div class="bg-slate-700 rounded-lg p-4">
                        <h4 class="font-bold mb-3">🔍 Información Adicional:</h4>
                        <div class="space-y-2 text-sm">
                            <p><span class="text-gray-400">Página actual tiene:</span> ${allXTOO.length} transacciones XTOO</p>
                            <p><span class="text-gray-400">Total transfers retornados:</span> ${result.transfers.length} (todos los tokens)</p>
                            ${result.nextPageToken ? `
                                <p class="text-yellow-400">⚠️ nextPageToken presente: Hay más transacciones disponibles</p>
                            ` : `
                                <p class="text-green-400">✅ No hay más páginas: Esta es la historia completa</p>
                            `}
                            <p><span class="text-gray-400">Transacción más antigua (XTOO):</span> ${inTransfers.length > 0 ? new Date(Math.min(...allXTOO.map(tx => tx.timestamp || Date.now() / 1000)) * 1000).toLocaleDateString() : 'N/A'}</p>
                        </div>
                    </div>
                    
                    <div class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <h4 class="font-bold mb-3 text-green-400">📥 Primeras 5 IN:</h4>
                            <div class="space-y-2">
                                ${inTransfers.slice(0, 5).map(tx => {
                                    const amount = parseFloat(tx.value);
                                    const date = tx.timestamp ? new Date(tx.timestamp * 1000).toLocaleDateString() : 'N/A';
                                    return `
                                        <div class="bg-slate-900 rounded p-2 text-xs">
                                            <div class="flex justify-between">
                                                <span class="text-gray-400">${date}</span>
                                                <span class="text-green-400 font-bold">+${amount.toFixed(2)}</span>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                        <div>
                            <h4 class="font-bold mb-3 text-red-400">📤 Primeras 5 OUT:</h4>
                            <div class="space-y-2">
                                ${outTransfers.slice(0, 5).map(tx => {
                                    const amount = parseFloat(tx.value);
                                    const date = tx.timestamp ? new Date(tx.timestamp * 1000).toLocaleDateString() : 'N/A';
                                    return `
                                        <div class="bg-slate-900 rounded p-2 text-xs">
                                            <div class="flex justify-between">
                                                <span class="text-gray-400">${date}</span>
                                                <span class="text-red-400 font-bold">-${amount.toFixed(2)}</span>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
