<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Etherscan V2 API - BSC Chain ID 56</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white p-8">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">🧪 Etherscan V2 API Test - BSC (Chain ID 56)</h1>
        
        <div class="bg-slate-800 rounded-lg p-6 mb-6">
            <h2 class="text-xl font-semibold mb-4">Test Configuration</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-2">Wallet Address</label>
                    <input type="text" id="walletInput" 
                           value="0xb9707c6e18417fa88c0f99c39e02b93cd3b6a156"
                           class="w-full bg-slate-700 text-white px-3 py-2 rounded border border-slate-600 focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-2">XTOO Contract</label>
                    <input type="text" id="contractInput" 
                           value="0x5cFC37a4AE6108E146f2Bbed702c4AcaBB5a149a"
                           class="w-full bg-slate-700 text-white px-3 py-2 rounded border border-slate-600 focus:border-blue-500">
                </div>
            </div>
            
            <div class="mb-4">
                <label class="block text-sm text-gray-400 mb-2">Etherscan API Key (✅ Configured)</label>
                <input type="password" id="apiKeyInput" 
                       value="EQ98GKDYBT5SP4UZJPN8E5UKEDFJPB6RYY"
                       placeholder="Paste your Etherscan API key here"
                       class="w-full bg-slate-700 text-white px-3 py-2 rounded border border-slate-600 focus:border-blue-500">
                <p class="text-xs text-green-400 mt-1">✅ API key configured - ready to test</p>
            </div>
            
            <div class="flex gap-4">
                <button onclick="testMethod1()" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded font-semibold">
                    Test Method 1: Contract-Specific
                </button>
                <button onclick="testMethod2()" class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded font-semibold">
                    Test Method 2: All Tokens (Filter)
                </button>
                <button onclick="testMethod3()" class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded font-semibold">
                    Test Method 3: V1 API (Old)
                </button>
            </div>
        </div>

        <!-- Results Container -->
        <div id="results" class="space-y-4"></div>
    </div>

    <script>
        async function testMethod1() {
            const wallet = document.getElementById('walletInput').value;
            const contract = document.getElementById('contractInput').value;
            const apiKey = document.getElementById('apiKeyInput').value;
            
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="bg-slate-800 rounded-lg p-6"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-400 mx-auto"></div><p class="text-center mt-4">Testing Method 1: Etherscan V2 Contract-Specific...</p></div>';
            
            const url = `https://api.etherscan.io/v2/api?chainid=56&module=account&action=tokentx&contractaddress=${contract}&address=${wallet}&page=1&offset=100&sort=desc&apikey=${apiKey}`;
            
            console.log('🔗 Method 1 URL:', url);
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                console.log('📊 Method 1 Response:', data);
                
                displayResults('Method 1: Contract-Specific (V2)', url, data, 'blue');
            } catch (error) {
                console.error('❌ Method 1 Error:', error);
                resultsDiv.innerHTML = `
                    <div class="bg-red-900/30 border border-red-500 rounded-lg p-6">
                        <h3 class="text-xl font-bold text-red-400 mb-2">❌ Method 1 Failed</h3>
                        <p class="text-gray-300">${error.message}</p>
                    </div>
                `;
            }
        }

        async function testMethod2() {
            const wallet = document.getElementById('walletInput').value;
            const contract = document.getElementById('contractInput').value;
            const apiKey = document.getElementById('apiKeyInput').value;
            
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="bg-slate-800 rounded-lg p-6"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-purple-400 mx-auto"></div><p class="text-center mt-4">Testing Method 2: All Tokens + Filter...</p></div>';
            
            const url = `https://api.etherscan.io/v2/api?chainid=56&module=account&action=tokentx&address=${wallet}&page=1&offset=100&sort=desc&apikey=${apiKey}`;
            
            console.log('🔗 Method 2 URL:', url);
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                console.log('📊 Method 2 Response:', data);
                
                // Filter for XTOO
                if (data.status === '1' && data.result) {
                    const xtooTxs = data.result.filter(tx => 
                        tx.contractAddress && tx.contractAddress.toLowerCase() === contract.toLowerCase()
                    );
                    
                    const filteredData = { ...data, result: xtooTxs };
                    console.log(`🔍 Found ${xtooTxs.length} XTOO transactions out of ${data.result.length} total`);
                    
                    displayResults('Method 2: All Tokens + Filter (V2)', url, filteredData, 'purple');
                } else {
                    displayResults('Method 2: All Tokens + Filter (V2)', url, data, 'purple');
                }
            } catch (error) {
                console.error('❌ Method 2 Error:', error);
                resultsDiv.innerHTML = `
                    <div class="bg-red-900/30 border border-red-500 rounded-lg p-6">
                        <h3 class="text-xl font-bold text-red-400 mb-2">❌ Method 2 Failed</h3>
                        <p class="text-gray-300">${error.message}</p>
                    </div>
                `;
            }
        }

        async function testMethod3() {
            const wallet = document.getElementById('walletInput').value;
            const contract = document.getElementById('contractInput').value;
            const apiKey = document.getElementById('apiKeyInput').value;
            
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="bg-slate-800 rounded-lg p-6"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-green-400 mx-auto"></div><p class="text-center mt-4">Testing Method 3: Old V1 API (Should Fail)...</p></div>';
            
            const url = `https://api.bscscan.com/api?module=account&action=tokentx&contractaddress=${contract}&address=${wallet}&page=1&offset=100&sort=desc&apikey=${apiKey}`;
            
            console.log('🔗 Method 3 URL:', url);
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                console.log('📊 Method 3 Response:', data);
                
                displayResults('Method 3: Old V1 API (Deprecated)', url, data, 'green');
            } catch (error) {
                console.error('❌ Method 3 Error:', error);
                resultsDiv.innerHTML = `
                    <div class="bg-red-900/30 border border-red-500 rounded-lg p-6">
                        <h3 class="text-xl font-bold text-red-400 mb-2">❌ Method 3 Failed</h3>
                        <p class="text-gray-300">${error.message}</p>
                    </div>
                `;
            }
        }

        function displayResults(title, url, data, color) {
            const resultsDiv = document.getElementById('results');
            
            const colorClasses = {
                blue: 'bg-blue-900/30 border-blue-500 text-blue-400',
                purple: 'bg-purple-900/30 border-purple-500 text-purple-400',
                green: 'bg-green-900/30 border-green-500 text-green-400'
            };
            
            const statusIcon = data.status === '1' ? '✅' : '❌';
            const statusColor = data.status === '1' ? 'text-green-400' : 'text-red-400';
            
            resultsDiv.innerHTML = `
                <div class="${colorClasses[color]} border rounded-lg p-6">
                    <h3 class="text-xl font-bold mb-4">${statusIcon} ${title}</h3>
                    
                    <div class="bg-slate-900/50 rounded p-3 mb-4">
                        <p class="text-xs text-gray-400 break-all">${url}</p>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <div>
                            <p class="text-sm text-gray-400">Status</p>
                            <p class="${statusColor} font-bold">${data.status}</p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-400">Message</p>
                            <p class="text-white font-semibold">${data.message || 'N/A'}</p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-400">Transactions Found</p>
                            <p class="text-white font-bold text-2xl">${data.result ? data.result.length : 0}</p>
                        </div>
                        <div>
                            <p class="text-sm text-gray-400">Response Type</p>
                            <p class="text-white font-semibold">${Array.isArray(data.result) ? 'Array' : typeof data.result}</p>
                        </div>
                    </div>
                    
                    ${data.status === '1' && data.result && data.result.length > 0 ? `
                        <div class="bg-slate-900/50 rounded p-4">
                            <h4 class="font-bold mb-2">First Transaction Sample:</h4>
                            <pre class="text-xs text-gray-300 overflow-x-auto">${JSON.stringify(data.result[0], null, 2)}</pre>
                        </div>
                        
                        <div class="mt-4">
                            <h4 class="font-bold mb-2">All Transactions:</h4>
                            <div class="space-y-2 max-h-96 overflow-y-auto">
                                ${data.result.map((tx, i) => `
                                    <div class="bg-slate-900/50 rounded p-3">
                                        <div class="flex justify-between items-start">
                                            <div>
                                                <p class="text-xs text-gray-400">#${i + 1} - ${new Date(parseInt(tx.timeStamp) * 1000).toLocaleString()}</p>
                                                <p class="text-sm font-mono">Hash: ${tx.hash.slice(0, 20)}...</p>
                                                <p class="text-sm">Token: ${tx.tokenSymbol} (${tx.tokenName})</p>
                                            </div>
                                            <div class="text-right">
                                                <p class="text-lg font-bold text-${color}-400">${(parseInt(tx.value) / Math.pow(10, parseInt(tx.tokenDecimal))).toFixed(2)} ${tx.tokenSymbol}</p>
                                                <p class="text-xs text-gray-400">From: ${tx.from.slice(0, 10)}...</p>
                                                <p class="text-xs text-gray-400">To: ${tx.to.slice(0, 10)}...</p>
                                            </div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : `
                        <div class="bg-yellow-900/20 border border-yellow-500 rounded p-4">
                            <p class="text-yellow-400">⚠️ No transactions found or API returned an error</p>
                            <pre class="text-xs text-gray-400 mt-2">${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `}
                </div>
            `;
        }
    </script>
</body>
</html>
