<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Web3 Direct - XTOO History</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">🧪 Test Web3 Direct Method (No API Key Needed)</h1>
        
        <div class="bg-slate-800 rounded-lg p-6 mb-6">
            <h2 class="text-xl font-semibold mb-4">Este método NO requiere API key</h2>
            <p class="text-gray-400 mb-4">Usa llamadas directas al RPC de BSC para obtener eventos de transferencia del contrato XTOO</p>
            
            <div class="mb-4">
                <label class="block text-sm text-gray-400 mb-2">Tu Wallet Address</label>
                <input type="text" id="walletInput" 
                       value="0xb9707c6e18417fa88c0f99c39e02b93cd3b6a156"
                       placeholder="0x..."
                       class="w-full bg-slate-700 text-white px-3 py-2 rounded border border-slate-600 focus:border-blue-500">
            </div>
            
            <button onclick="testWeb3Direct()" 
                    class="bg-blue-600 hover:bg-blue-700 px-6 py-3 rounded font-semibold">
                🔍 Get XTOO History via Web3 Direct
            </button>
        </div>

        <div id="results" class="space-y-4"></div>
    </div>

    <script>
        async function testWeb3Direct() {
            const wallet = document.getElementById('walletInput').value.toLowerCase();
            const resultsDiv = document.getElementById('results');
            
            resultsDiv.innerHTML = `
                <div class="bg-slate-800 rounded-lg p-6">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-400 mx-auto mb-4"></div>
                    <p class="text-center text-gray-400">Fetching XTOO transfers from BSC blockchain...</p>
                    <p class="text-center text-xs text-gray-500 mt-2">This may take 10-30 seconds</p>
                </div>
            `;
            
            try {
                // ERC20 Transfer event signature: Transfer(address indexed from, address indexed to, uint256 value)
                const transferSignature = '0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef';
                
                // Pad wallet address to 32 bytes for topic filter
                const walletTopic = '0x000000000000000000000000' + wallet.slice(2);
                
                // Get transfers TO this wallet (incoming only)
                const incomingTopics = [
                    transferSignature,  // Transfer event
                    null,              // from (any address)
                    walletTopic        // to (this wallet)
                ];
                
                console.log('🔍 Fetching XTOO transfers...');
                console.log('Contract:', '0x5cFC37a4AE6108E146f2Bbed702c4AcaBB5a149a');
                console.log('Wallet:', wallet);
                console.log('Topics:', incomingTopics);
                
                const response = await fetch('https://bsc-dataseed.binance.org/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        jsonrpc: '2.0',
                        method: 'eth_getLogs',
                        params: [{
                            address: '0x5cFC37a4AE6108E146f2Bbed702c4AcaBB5a149a', // XTOO contract
                            topics: incomingTopics,
                            fromBlock: '0x0',      // From beginning
                            toBlock: 'latest'
                        }],
                        id: 1
                    })
                });
                
                const data = await response.json();
                
                console.log('📊 Web3 Response:', data);
                
                if (data.result && data.result.length > 0) {
                    displayResults(data.result, wallet);
                } else if (data.error) {
                    resultsDiv.innerHTML = `
                        <div class="bg-red-900/30 border border-red-500 rounded-lg p-6">
                            <h3 class="text-xl font-bold text-red-400 mb-2">❌ RPC Error</h3>
                            <p class="text-gray-300 mb-2">${data.error.message}</p>
                            <pre class="text-xs text-gray-400 bg-slate-900 p-3 rounded overflow-x-auto">${JSON.stringify(data.error, null, 2)}</pre>
                        </div>
                    `;
                } else {
                    resultsDiv.innerHTML = `
                        <div class="bg-yellow-900/30 border border-yellow-500 rounded-lg p-6">
                            <h3 class="text-xl font-bold text-yellow-400 mb-2">⚠️ No Transfers Found</h3>
                            <p class="text-gray-300">No XTOO transfers found for this wallet.</p>
                            <p class="text-sm text-gray-400 mt-2">Possible reasons:</p>
                            <ul class="text-sm text-gray-400 list-disc ml-6 mt-2">
                                <li>Wallet hasn't received XTOO tokens yet</li>
                                <li>Wrong wallet address</li>
                                <li>RPC node limitations</li>
                            </ul>
                        </div>
                    `;
                }
                
            } catch (error) {
                console.error('❌ Error:', error);
                resultsDiv.innerHTML = `
                    <div class="bg-red-900/30 border border-red-500 rounded-lg p-6">
                        <h3 class="text-xl font-bold text-red-400 mb-2">❌ Fetch Error</h3>
                        <p class="text-gray-300">${error.message}</p>
                    </div>
                `;
            }
        }
        
        function displayResults(logs, wallet) {
            const resultsDiv = document.getElementById('results');
            
            // Parse logs
            const transactions = logs.map((log, index) => {
                // Parse topics and data
                const from = '0x' + log.topics[1].slice(26);
                const to = '0x' + log.topics[2].slice(26);
                const value = BigInt(log.data);
                const xtooAmount = Number(value) / 1e18;
                
                // Get block info
                const blockNumber = parseInt(log.blockNumber, 16);
                
                return {
                    hash: log.transactionHash,
                    from: from.toLowerCase(),
                    to: to.toLowerCase(),
                    value: xtooAmount,
                    blockNumber: blockNumber,
                    blockHash: log.blockHash
                };
            });
            
            // Calculate total XTOO received
            const totalXTOO = transactions.reduce((sum, tx) => sum + tx.value, 0);
            
            console.log(`✅ Found ${transactions.length} XTOO incoming transfers`);
            console.log(`💰 Total XTOO Received: ${totalXTOO.toFixed(6)} XTOO`);
            
            resultsDiv.innerHTML = `
                <div class="bg-green-900/30 border border-green-500 rounded-lg p-6">
                    <h3 class="text-2xl font-bold text-green-400 mb-4">✅ Success!</h3>
                    
                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <div class="bg-slate-800 rounded-lg p-4">
                            <p class="text-sm text-gray-400">Transactions Found</p>
                            <p class="text-3xl font-bold text-white">${transactions.length}</p>
                        </div>
                        <div class="bg-slate-800 rounded-lg p-4">
                            <p class="text-sm text-gray-400">Total XTOO Received</p>
                            <p class="text-3xl font-bold text-green-400">${totalXTOO.toFixed(2)}</p>
                        </div>
                    </div>
                    
                    <h4 class="font-bold mb-3">Transaction History (Incoming Only):</h4>
                    <div class="space-y-2 max-h-96 overflow-y-auto">
                        ${transactions.map((tx, i) => `
                            <div class="bg-slate-800 rounded p-3">
                                <div class="flex justify-between items-start">
                                    <div class="flex-1">
                                        <p class="text-xs text-gray-400">#${i + 1} - Block ${tx.blockNumber}</p>
                                        <p class="text-sm font-mono text-gray-300 mt-1">
                                            <a href="https://bscscan.com/tx/${tx.hash}" target="_blank" class="hover:text-blue-400">
                                                ${tx.hash.slice(0, 20)}... ↗
                                            </a>
                                        </p>
                                        <p class="text-xs text-gray-400 mt-1">From: ${tx.from.slice(0, 10)}...${tx.from.slice(-8)}</p>
                                    </div>
                                    <div class="text-right">
                                        <p class="text-lg font-bold text-green-400">+${tx.value.toFixed(2)}</p>
                                        <p class="text-xs text-gray-400">XTOO</p>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    
                    <div class="mt-4 bg-blue-900/30 border border-blue-500/50 rounded p-3">
                        <p class="text-sm text-blue-300">✅ This method works WITHOUT API key!</p>
                        <p class="text-xs text-gray-400 mt-1">Uses direct RPC calls to BSC blockchain</p>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
